name: Build Lemuroid Drive v1.1 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout Lemuroid 1.17.0
        run: git clone --depth 1 --branch 1.17.0 --recurse-submodules --shallow-submodules https://github.com/Swordfish90/Lemuroid.git Lemuroid

      - name: Apply Drive v1.1 mod
        run: python3 build_mod_v2.py Lemuroid

      - name: Build installable debug APK
        working-directory: Lemuroid
        run: |
          chmod +x gradlew
          ./gradlew assembleFreeDynamicDebug --stacktrace

      - name: Collect APK
        run: |
          APK=$(find Lemuroid/lemuroid-app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" Lemuroid-Drive-v1.1.apk
          sha256sum Lemuroid-Drive-v1.1.apk
          ls -lh Lemuroid-Drive-v1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lemuroid-Drive-v1.1-APK
          path: Lemuroid-Drive-v1.1.apk
          if-no-files-found: error
