name: Build Lemuroid Drive v1.2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore proven v1.1 patch scripts
        run: |
          curl -fsSL https://raw.githubusercontent.com/judecitoxd-dev/Animal-crossing-androidxd/d5d81d22d4195d8dee4e5a7eccedba32f64c5ace/build_mod_v2.py -o build_mod_v2.py
          curl -fsSL https://raw.githubusercontent.com/judecitoxd-dev/Animal-crossing-androidxd/d5d81d22d4195d8dee4e5a7eccedba32f64c5ace/fix_v2.py -o fix_v2.py

      - name: Checkout Lemuroid 1.17.0
        run: git clone --depth 1 --branch 1.17.0 --recurse-submodules --shallow-submodules https://github.com/Swordfish90/Lemuroid.git Lemuroid

      - name: Apply Drive v1.2 mod
        run: |
          python3 build_mod_v2.py Lemuroid
          python3 fix_v2.py Lemuroid
          python3 final_fix.py Lemuroid
          python3 zip_fast_scan_v12.py Lemuroid

      - name: Build installable debug APK
        working-directory: Lemuroid
        run: |
          chmod +x gradlew
          ./gradlew assembleFreeDynamicDebug --stacktrace

      - name: Collect APK
        run: |
          APK=$(find Lemuroid/lemuroid-app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" Lemuroid-Drive-v1.2.apk
          sha256sum Lemuroid-Drive-v1.2.apk
          ls -lh Lemuroid-Drive-v1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lemuroid-Drive-v1.2-APK
          path: Lemuroid-Drive-v1.2.apk
          if-no-files-found: error
